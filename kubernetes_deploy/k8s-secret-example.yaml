# Kubernetes Secret for LibreChat
# DO NOT commit this file with real values to version control!
#
# To create this secret:
# 1. Fill in the actual values below
# 2. kubectl apply -f k8s-secret-example.yaml
#
# Or create from .env file:
# kubectl create secret generic librechat-credentials-env --from-env-file=.env

apiVersion: v1
kind: Secret
metadata:
  name: librechat-credentials-env
  namespace: librechat  # Change to your namespace
type: Opaque
stringData:
  # ============================================
  # Critical Security Keys (REQUIRED)
  # Generate with: openssl rand -hex 32
  # ============================================
  CREDS_KEY: "f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0"
  # Generate with: openssl rand -hex 16
  CREDS_IV: "e2341419ec3dd3d19b13a1a87fafcbfb"
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "16f8c0ef4a5d391b26034086c628469d3f9f497f08163ab9b40137092f2909ef"
  JWT_REFRESH_SECRET: "eaa5191f2914e30b9387fd84e254e4ba6fc51b4654968a9b0803b456a54b8418"

  # ============================================
  # Meilisearch Master Key (REQUIRED)
  # ============================================
  MEILI_MASTER_KEY: "DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt"

  # ============================================
  # AI Provider API Keys (Optional - user_provided)
  # ============================================
  OPENAI_API_KEY: "user_provided"
  ANTHROPIC_API_KEY: "user_provided"
  GOOGLE_KEY: "user_provided"
  ASSISTANTS_API_KEY: "user_provided"

  # ============================================
  # Session Configuration
  # ============================================
  SESSION_EXPIRY: "900000"  # 15 minutes in milliseconds
  REFRESH_TOKEN_EXPIRY: "604800000"  # 7 days in milliseconds

  # ============================================
  # Optional: Email Configuration
  # ============================================
  # EMAIL_SERVICE: ""
  # EMAIL_HOST: ""
  # EMAIL_PORT: "25"
  # EMAIL_USERNAME: ""
  # EMAIL_PASSWORD: ""
  # EMAIL_FROM: "noreply@librechat.ai"
  # EMAIL_FROM_NAME: "LibreChat"

  # ============================================
  # Optional: OAuth Configuration
  # ============================================
  # GOOGLE_CLIENT_ID: ""
  # GOOGLE_CLIENT_SECRET: ""
  # GITHUB_CLIENT_ID: ""
  # GITHUB_CLIENT_SECRET: ""
  # DISCORD_CLIENT_ID: ""
  # DISCORD_CLIENT_SECRET: ""

  # ============================================
  # Optional: Cloud Storage
  # ============================================
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_REGION: ""
  # AWS_BUCKET_NAME: ""

  # ============================================
  # Optional: Plugin API Keys
  # ============================================
  # GOOGLE_SEARCH_API_KEY: ""
  # GOOGLE_CSE_ID: ""
  # WOLFRAM_APP_ID: ""
  # TAVILY_API_KEY: ""
